name: shadcn_wrapper
description: >-
  Reusable wrapper layer over shadcn_flutter (pre-1.0). Apps depend ONLY on the
  App* API here — if shadcn's API churns, fix ONE adapter file, not 300 screens.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shadcn_flutter: ^0.0.52

dev_dependencies:
  flutter_lints: ^5.0.0
