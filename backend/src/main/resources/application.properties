spring.application.name=demo

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventory_playground}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:amir123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---- Logging ----
# Append the correlation id (set by CorrelationIdFilter via MDC) to every line.
# ":-" gives an empty fallback outside a request. Applies to console AND file.
logging.pattern.level=%5p [%X{requestId:-}]

# File: readable text written to logs/inventory-playground.log (next to where the
# app is launched). Same format as console, but with full date + timestamp.
logging.file.name=logs/inventory-playground.log

# Rolling policy: rotate at 10MB, keep 14 days, gzip old files, cap total size.
logging.logback.rollingpolicy.file-name-pattern=logs/inventory-playground.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB

# Console on/off trigger for the whole app. Default shows everything; set the
# env var CONSOLE_LOG_LEVEL=OFF to silence the console (file logging continues).
logging.threshold.console=${CONSOLE_LOG_LEVEL:TRACE}

# Want machine-parseable JSON in the file for production log aggregation
# (ELK/Loki/Datadog)? Uncomment these — the file becomes ECS JSON, console stays text.
#logging.structured.format.file=ecs
#logging.structured.ecs.service.name=inventory-playground

# Default level; overridden per profile (see application-dev/prod.properties).
logging.level.root=INFO